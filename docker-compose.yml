# HOSTI-STOCK – Docker Compose


services:
  mysql:
    image: mysql:8.4
    container_name: hostistock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"   # Expuesto para desarrollo; quitar en producción
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hostistock-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostistock-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_JWT_SECRETO: ${APP_JWT_SECRETO}
      APP_JWT_EXPIRACION_MS: ${APP_JWT_EXPIRACION_MS}
      APP_IA_URL: ${APP_IA_URL}
      # Mantener python-path y directorio para compatibilidad,
      # pero en Docker el backend usará HTTP contra el servicio IA
      APP_IA_PYTHON_PATH: python3
      APP_IA_DIRECTORIO: /tmp/ia
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - hostistock-net

  ia:
    build:
      context: ./ia
      dockerfile: Dockerfile
    container_name: hostistock-ia
    volumes:
      - ia_modelos:/app/modelos
      - ia_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - hostistock-net

volumes:
  mysql_data:
    name: hostistock-mysql-data
  ia_modelos:
    name: hostistock-ia-modelos
  ia_data:
    name: hostistock-ia-data

networks:
  hostistock-net:
    name: hostistock-net
