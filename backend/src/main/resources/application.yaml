# HOSTI-STOCK – Configuración

spring:
  application:
    name: hosti-stock
  profiles:
    active: dev

app:
  jwt:
    secreto: ${APP_JWT_SECRETO:hostistock-clave-secreta-jwt-desarrollo-minimo-treinta-y-dos-bytes}
    expiracion-ms: ${APP_JWT_EXPIRACION_MS:86400000}
  ia:
    python-path: ${APP_IA_PYTHON_PATH:../ia/.venv/Scripts/python.exe}
    directorio: ${APP_IA_DIRECTORIO:../ia}
    url: ${APP_IA_URL:}

---
# Perfil: dev (MySQL corriendo en localhost:3306)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/hostistock?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

---
# Perfil: docker
# Todas las credenciales en .env
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secreto: ${APP_JWT_SECRETO}
    expiracion-ms: ${APP_JWT_EXPIRACION_MS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
