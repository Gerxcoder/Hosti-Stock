# HOSTI-STOCK – Configuración para TESTS

spring:
  application:
    name: hosti-stock

  datasource:
    url: jdbc:h2:mem:hostistock_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

app:
  jwt:
    secreto: test-clave-secreta-hostistock-solo-para-tests-treinta-y-dos-bytes
    expiracion-ms: 3600000
  ia:
    python-path: python
    directorio: ../ia
